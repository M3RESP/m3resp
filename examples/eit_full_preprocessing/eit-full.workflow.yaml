# Full EIT preprocessing workflow.
#
# Exercises every EIT operation the gap migration closed onto
# `EITProcessingAdapter`: loading, rate detection, MDN filtering, global
# breath detection, continuous TIV/EELI, pixel-breath timing, pixel TIV, and
# the four ROI lung-space steps. Run with:
#
#   m3resp run examples/eit_full_preprocessing/eit-full.workflow.yaml
#
# from the repository root - path-typed `with:`/`inputs:` values (like
# `inputs.eit_file` below) resolve relative to this spec file's own
# directory, same as `outputs.dir`, not the process working directory.
#
# `schema_version: 1` enables strict
# parsing: unknown keys and non-boolean flags are hard errors instead of a
# permissive/deprecated coercion. Every step below has an explicit `id:` so
# GUI/provenance references to a specific step survive reordering.
#
#   experiment:  study metadata; unused here (no export.rotarc_result step)
#   outputs:     where to write results and which artifacts to produce
#   inputs:      data paths (referenced in steps with @name)
#
# Reading the wiring: the names under `in:` are outputs earlier steps
# produced, never free-form labels. Every step below states which signal it
# works on, so the flow can be traced top to bottom without consulting the
# source. The two that matter are:
#
#   raw_eit          pixel impedance as loaded, before any filtering
#   filtered_eit     the same pixel impedance after eit.mdn_filter
#   global_impedance the summed impedance derived from filtered_eit
#
# Internal plumbing (the recording container, and the breath detector reused
# between steps) is bound automatically and left out to keep the wiring
# readable. To see everything a step reads and writes, including that
# plumbing, run `m3resp describe <operation>` (e.g. `m3resp describe
# eit.mdn_filter`), or `m3resp steps --details` for all of them at once.

schema_version: 1
name: eit-full-preprocessing

outputs:
  dir: ../../output/eit-full-preprocessing
  mode: automatic
  timestamped: true
  summary_json: true
  event_csvs: true
  parameters_csv: false
  structured_export: true
  figures: true

inputs:
  eit_file: ../../tests/data/draeger_synthetic_draeger_20Hz.bin
  vendor: draeger

steps:
  - id: load
    uses: eit.load
    with: { file_path: "@eit_file", vendor: "@vendor" }

  - id: detect_rates
    uses: eit.detect_rates
    in:  { signal: raw_eit }
    with: { subject_type: adult, capture: true }

  # Removes the cardiac component from the raw pixel impedance, using the
  # two rates found above. Writes `filtered_eit`, which most steps below
  # read. (This step also takes an optional `label:`, which only names the
  # filtered data inside the recording - it is not a workflow name and
  # nothing reads it, so it is left at its default here.)
  - id: mdn_filter
    uses: eit.mdn_filter
    in:  { signal: raw_eit }

  - id: global_impedance
    uses: eit.global_impedance
    in:  { signal: filtered_eit }

  - id: detect_breaths
    uses: eit.detect_breaths
    in:  { signal: global_impedance }
    with: { min_duration_s: 0.6666666667 }

  - id: normalize_breaths
    uses: eit.normalize_breaths
    in:  { breath_intervals: breath_intervals }

  - id: continuous_tiv
    uses: eit.continuous_tiv
    in:  { signal: global_impedance }

  - id: eeli
    uses: eit.eeli
    in:  { signal: global_impedance }

  # Pixel-breath timing (per-pixel start/middle/end of in-/deflation);
  # NaN marks the always-unavailable first/last global breath and any
  # pixel whose breath couldn't be determined.
  - id: pixel_breaths
    uses: eit.pixel_breaths
    in:  { eit_data: filtered_eit, timing_data: global_impedance }
    with: { phase_correction_mode: "negative amplitude" }

  - id: pixel_tiv
    uses: eit.pixel_tiv
    in:  { eit_data: filtered_eit, signal: global_impedance }
    with: { tiv_timing: continuous }

  - id: roi_tiv_lungspace
    uses: eit.roi_tiv_lungspace
    in:  { eit_data: filtered_eit, timing_data: global_impedance }
    with: { threshold: 0.15 }

  # Included to show the step; no later step reads its output. The amplitude
  # lung space can include reconstruction artefacts, so it is not advised on
  # its own.
  - id: roi_amplitude_lungspace
    uses: eit.roi_amplitude_lungspace
    in:  { eit_data: filtered_eit, timing_data: global_impedance }
    with: { threshold: 0.15 }

  # Computes the TIV and the amplitude of each pixel itself from
  # filtered_eit and global_impedance.
  - id: roi_watershed
    uses: eit.roi_watershed
    in:  { eit_data: filtered_eit, timing_data: global_impedance }
    with: { threshold_fraction: 0.15 }

  # eit.roi_filter_by_size.mask has no default binding, so the spec binds
  # the watershed mask.
  - id: roi_filter_by_size
    uses: eit.roi_filter_by_size
    in:  { mask: watershed_lungspace_result }
    with: { min_region_size: 10, connectivity: 1 }
