# ROTARC breath-duration variability pipeline.
#
# Run with: python -m m3resp run breath-duration.pipeline.yaml
#
#   experiment:  study metadata; drives the output filename
#   outputs:     where to write results and which artifacts to produce
#   inputs:      data paths (referenced in steps with @name)

name: rotarc-breath-duration

experiment:
  subject_id: subject
  mode: mode
  timepoint:               # leave blank for no timepoint in the filename
  run_identifier: test-run
  selection: selected

outputs:
  dir: ../../output/rotarc-breath-duration
  # export.rotarc_result honors this: results land under
  # <dir>/<timestamp>/subject_results/<run_identifier>/... instead of
  # overwriting the same folder on every run. Set to false to go back to a
  # fixed, non-timestamped run folder.
  timestamped: true
  summary_json: true
  event_csvs: true
  parameters_csv: false
  postprocessing: true
  figures: true

inputs:
  eit_file: /home/mahyart/Desktop/M3Resp/EIT_EMG/ajM3resp_02_001_01.bin #.../PCvPS-Blankman/raw .bin files/B001/B001_01_01.bin
  vendor: draeger

steps:
  - uses: eit.load
    with: { file: "@eit_file", vendor: "@vendor" }

  # start/end are sample indices into eit_file above (0:1550 = the full
  # recording for the currently configured file, 1550 samples at 50 Hz).
  # Re-check these against len(raw_eit) if you point eit_file at a
  # different recording - an out-of-range slice fails silently (empty
  # result) rather than raising, and shows up later as a confusing crash
  # in rate/breath detection.
  - uses: eit.slice
    in:  { signal: raw_eit }
    with: { start: 0, end: 1550, mode: index }
    out: { result: selected_eit }

  - uses: eit.detect_rates
    in:  { signal: selected_eit }
    with: { subject_type: adult }

  - uses: eit.mdn_filter
    in:  { signal: raw_eit }

  - uses: eit.global_impedance
    in:  { signal: filtered_eit }

  - uses: eit.slice
    in:  { signal: global_impedance }
    with: { start: 0, end: 1550, mode: index }
    out: { result: detection_signal }

  - uses: eit.detect_breaths
    in:  { signal: detection_signal }
    with: { min_duration_s: 0.6666666667 }

  - uses: eit.normalize_breaths

  - uses: metric.interval_cv
    in:  { intervals: breath_intervals }
    out: { cv: breath_duration_cv }

  # Writes <outputs.dir>/subject_results/<run_identifier>/<subject>-<mode>-<tp>-<selection>.txt
  # and rotarc_summary.json, then exports event CSVs per the outputs: section.
  - uses: export.rotarc_result
    in:  { value: breath_duration_cv }
    with: { precision: 8 }
