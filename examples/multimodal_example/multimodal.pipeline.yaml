# Full multimodal (EIT + EMG + ventilator) pipeline.
#
# Run with: python -m m3resp run multimodal.pipeline.yaml

name: multimodal

outputs:
  dir: ../../output/multimodal-summary
  timestamped: true
  summary_json: true
  event_csvs: true
  parameters_csv: true
  postprocessing: true
  figures: false

inputs:
  eit_file: data/source/synthetic/20260610_153009/m3resp_multimodal_1_eit_draeger.bin
  emg_file: data/source/synthetic/20260610_153009/m3resp_multimodal_1_emg.Poly5
  vent_file: data/source/synthetic/20260610_153009/m3resp_multimodal_1_ventilator.Poly5

steps:
  # Load
  - uses: eit.load
    with: { file: "@eit_file", vendor: draeger }

  - uses: emg.load
    with: { file: "@emg_file" }

  - uses: emg.load_ventilator
    with: { file: "@vent_file" }

  # Synchronize raw signals before processing
  - uses: session.sync_raw
    with:
      method: manual_offset
      offset_seconds: { eit: 0.0, emg: -2.0, vent: 0.0 }
      reference_modality: vent

  # EIT processing
  - uses: eit.detect_rates
    in:  { signal: raw_eit }
    with: { subject_type: adult, welch_window_seconds: 30.0, capture: true }

  - uses: eit.mdn_filter
    in:  { signal: raw_eit }
    with: { label: mdn_filtered }

  - uses: eit.global_impedance
    in:  { signal: filtered_eit }

  - uses: eit.detect_breaths
    in:  { signal: global_impedance }
    with: { min_duration_s: 0.6666666667 }

  - uses: eit.normalize_breaths

  - uses: eit.continuous_tiv
    in:  { signal: global_impedance }

  - uses: eit.eeli
    in:  { signal: global_impedance }

  - uses: eit.pixel_tiv
    in:  { signal: global_impedance, filtered_eit: filtered_eit }

  # EMG processing
  - uses: emg.preprocess
    with: { channel: 0, high_pass_hz: 80, envelope_window_seconds: 0.5 }

  - uses: emg.detect_breaths
    with: { min_breath_width_seconds: 1.0 }

  - uses: emg.peak_indices

  - uses: emg.ventilator_channels
    with:
      pressure_channel: 0
      flow_channel: 1
      volume_channel: 2

  - uses: emg.slopesum_baseline
    with: { window_seconds: 30.0, step_seconds: 1.0, percentile: 33.0 }

  - uses: emg.find_occluded_breaths

  - uses: emg.detect_ventilator_breath
    with: { breath_width_seconds: 0.5 }

  - uses: emg.detect_non_consecutive_manoeuvres

  - uses: emg.normalize_ventilator_breaths
    with: { breath_width_seconds: 0.5 }

  # No explicit export step needed — the `outputs:` section above handles
  # creating the timestamped directory and calling export_session_summary.
