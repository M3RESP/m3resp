# Full multimodal (EIT + EMG + ventilator) pipeline expressed as a declarative
# spec.  Values here mirror examples/multimodal_example/config.yaml exactly so
# running either script should produce identical outputs.
#
# Usage:
#   python examples/multimodal_example/run_pipeline_spec.py
#
# The ventilator array is NOT listed here (it is a binary array and cannot be
# serialized to YAML).  The emg.postprocess step reads it from
# session.raw["vent"] automatically after emg.load puts it there.

name: multimodal

steps:
  # ── Load ─────────────────────────────────────────────────────────────────
  - uses: eit.load
    with:
      file: data/source/synthetic/20260610_153009/m3resp_multimodal_1_eit_draeger.bin
      vendor: draeger

  - uses: emg.load
    with:
      file: data/source/synthetic/20260610_153009/m3resp_multimodal_1_emg.Poly5
      vent_file: data/source/synthetic/20260610_153009/m3resp_multimodal_1_ventilator.Poly5

  # ── Synchronise raw signals (crop by manual offset before processing) ────
  - uses: session.sync_raw
    with:
      method: manual_offset
      offset_seconds: { eit: 0.0, emg: -2.0, vent: 0.0 }

  # ── EIT processing (granular) ─────────────────────────────────────────────
  - uses: eit.detect_rates
    in:  { signal: raw_eit }
    with: { subject_type: adult, welch_window_seconds: 30.0, capture: true }

  - uses: eit.mdn_filter
    in:  { signal: raw_eit }
    with: { label: mdn_filtered }

  - uses: eit.global_impedance
    in:  { signal: filtered_eit }

  - uses: eit.detect_breaths
    in:  { signal: global_impedance }
    with: { min_duration_s: 0.6666666667 }

  - uses: eit.normalize_breaths

  - uses: eit.continuous_tiv
    in:  { signal: global_impedance }

  - uses: eit.eeli
    in:  { signal: global_impedance }

  - uses: eit.pixel_tiv
    in:  { signal: global_impedance, filtered_eit: filtered_eit }

  # ── EMG processing ────────────────────────────────────────────────────────
  - uses: emg.preprocess
    with: { channel: 0, high_pass_hz: 80, envelope_window_seconds: 0.5 }

  - uses: emg.detect_breaths
    with: { min_breath_width_seconds: 1.0, half_window_seconds: 0.5 }

  - uses: emg.postprocess
    # ventilator is read from session.raw["vent"] automatically at run time
    with:
      ventilator_pressure_channel: 0
      ventilator_flow_channel: 1
      ventilator_volume_channel: 2
      ventilator_breath_width_seconds: 0.5
      baseline_window_seconds: 30.0
      baseline_step_seconds: 1.0
      baseline_percentile: 33.0
      slope_window_seconds: 0.5
      aub_window_seconds: 5.0
      selected_functions:
        baseline:
          moving_baseline: true
          slopesum_baseline: true
        event_detection:
          find_occluded_breaths: true
          onoffpeak_baseline_crossing: false
          onoffpeak_slope_extrapolation: false
          detect_ventilator_breath: true
          detect_emg_breaths: true
        features:
          time_to_peak: false
          pseudo_slope: false
          amplitude: false
          time_product: false
          area_under_baseline: false
          respiratory_rate: false
        quality_assessment:
          snr_pseudo: false
          pocc_quality: false
          interpeak_dist: false
          percentage_under_baseline: false
          detect_local_high_aub: false
          detect_extreme_time_products: false
          detect_non_consecutive_manoeuvres: true
          evaluate_bell_curve_error: false
          evaluate_event_timing: false
          evaluate_respiratory_rates: false

  # ── Align events across modalities ────────────────────────────────────────
  - uses: session.align
    with:
      method: manual_offset
      offset_seconds: 0.0
      reference_modality: vent
