# Full EMG/ventilator preprocessing pipeline (Stage 2 ReSurfEMG gap
# migration, Phase 7: plan/stage2/2_resurfemg_gap_migration_implementation_plan.md).
#
# Exercises every EMG/ventilator operation the gap migration closed onto
# `ReSurfEMGAdapter`: loading, ECG peak detection + gating, EMG breath
# detection, moving-baseline, on/offset detection, breath features,
# ventilator-breath and Pocc-manoeuvre detection, Pocc prerequisites, and all
# ten clinical quality operations. Run with:
#
#   m3resp run examples/emg_full_preprocessing/emg-full.pipeline.yaml
#
# from the repository root - path-typed `with:`/`inputs:` values (like
# `inputs.emg_file`/`vent_file` below) resolve relative to this spec file's
# own directory, same as `outputs.dir`, not the process working directory.
#
# ECG removal and baseline are each one of two available alternatives (see
# `docs/pipelines.md` "Baseline alternatives" / "ECG-removal alternatives"):
# this pipeline picks emg.ecg_gating and emg.moving_baseline; short YAML
# snippets showing the emg.ecg_wavelet_denoising / emg.slopesum_baseline
# substitutes are in the docs rather than run here too, since both write the
# same context keys (processed_emg / baseline) and are not meant to run
# together in one pipeline.
#
# `schema_version: 1` enables strict parsing (Stage 2 Phase 2/9); every step
# below has an explicit `id:` so GUI/provenance references survive reordering.
#
#   outputs:  where to write results and which artifacts to produce
#   inputs:   data paths (referenced in steps with @name)

schema_version: 1
name: emg-full-preprocessing

outputs:
  dir: ../../output/emg-full-preprocessing
  mode: automatic
  timestamped: true
  summary_json: true
  event_csvs: true
  parameters_csv: false
  structured_export: true

inputs:
  emg_file: ../../data/source/data_from_repo/emg_data_synth_quiet_breathing.Poly5
  vent_file: ../../data/source/data_from_repo/vent_data_synth_quiet_breathing.Poly5

steps:
  # -- Loading ---------------------------------------------------------------
  - id: load
    uses: emg.load
    with: { file: "@emg_file" }

  - id: load_ventilator
    uses: ventilator.load
    with: { file: "@vent_file" }

  - id: ventilator_channels
    uses: ventilator.channels
    with: { pressure_channel: 0, flow_channel: 1, volume_channel: 2 }

  # -- Preprocessing + ECG removal --------------------------------------------
  # Channel 1 ("EMGdi") is the diaphragm EMG channel in this fixture; channel
  # 0 ("ECG") is a dedicated reference ECG channel used for peak detection
  # below instead of the (also ECG-contaminated) EMG channel itself.
  - id: preprocess
    uses: emg.preprocess
    with: { channel: 1, envelope_window_seconds: 0.5 }
    out: { processed_emg: processed_emg_before_ecg }

  - id: ecg_detect_peaks
    uses: emg.ecg_detect_peaks
    in: { processed_emg: processed_emg_before_ecg }
    with: { ecg_channel: 0 }

  - id: ecg_gating
    uses: emg.ecg_gating
    in: { processed_emg: processed_emg_before_ecg }
    with: { fill_method: 1 }
    out: { processed_emg_after_ecg: processed_emg }

  # -- EMG breath detection ---------------------------------------------------
  # min_breath_width_seconds is narrower than the 1.0 s default: this
  # fixture's "quiet breathing" envelope bursts are shorter than that,
  # so the default finds zero breaths - see docs/pipelines.md "Channel
  # selection and time-base rules".
  - id: detect_breaths
    uses: emg.detect_breaths
    with: { min_breath_width_seconds: 0.5, half_window_seconds: 0.5 }

  - id: peak_indices
    uses: emg.peak_indices

  - id: moving_baseline
    uses: emg.moving_baseline
    with: { window_seconds: 30.0, step_seconds: 1.0, percentile: 33.0 }

  - id: onoffpeak_baseline_crossing
    uses: emg.onoffpeak_baseline_crossing

  # -- EMG breath features -----------------------------------------------------
  - id: time_to_peak
    uses: emg.time_to_peak
  - id: pseudo_slope
    uses: emg.pseudo_slope
  - id: amplitude
    uses: emg.amplitude
  - id: time_product
    uses: emg.time_product
  - id: area_under_baseline
    uses: emg.area_under_baseline
  - id: respiratory_rate
    uses: emg.respiratory_rate

  # -- Ventilator breath and Pocc-manoeuvre detection -------------------------
  - id: detect_ventilator_breath
    uses: ventilator.detect_breaths
    with: { breath_width_seconds: 0.5 }

  - id: find_occluded_breaths
    uses: ventilator.find_occluded_breaths

  - id: ventilator_respiratory_rate
    uses: ventilator.respiratory_rate

  - id: pocc_intervals
    uses: ventilator.pocc_intervals

  - id: pocc_time_product
    uses: ventilator.pocc_time_product

  - id: normalize_ventilator_breaths
    uses: ventilator.normalize_breaths
    with: { breath_width_seconds: 0.5 }

  # -- Clinical quality steps (run whenever their inputs are present) --------
  - id: snr_pseudo
    uses: emg.snr_pseudo
  - id: percentage_under_baseline
    uses: emg.percentage_under_baseline
  - id: detect_local_high_aub
    uses: emg.detect_local_high_aub
  - id: detect_extreme_time_products
    uses: emg.detect_extreme_time_products
  - id: detect_non_consecutive_manoeuvres
    uses: ventilator.detect_non_consecutive_manoeuvres
  - id: evaluate_bell_curve_error
    uses: emg.evaluate_bell_curve_error
  - id: evaluate_event_timing
    uses: emg.evaluate_event_timing
  - id: evaluate_respiratory_rates
    uses: emg.evaluate_respiratory_rates
  - id: pocc_quality
    uses: ventilator.pocc_quality
  - id: interpeak_dist
    uses: emg.interpeak_dist

  # No explicit export step needed — the `outputs:` section above handles
  # creating the timestamped directory and calling export_session_summary,
  # including the native structured export (signals/parameter_results/
  # quality CSVs and the shared parameter_result_arrays.npz archive).
