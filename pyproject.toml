[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m3resp"
description = "Multimodal respiratory processing for EIT, EMG, and ventilator signals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "M3Resp contributors" },
]
keywords = ["respiration", "EIT", "EMG", "multimodal", "biomedical"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "loguru",
  "numpy",
  "pandas",
  "pydantic>=2",
  "PyYAML",
  "scipy",
]
dynamic = ["version"]

[project.optional-dependencies]
eit = [
  "eitprocessing @ git+https://github.com/M3RESP/eitprocessing.git@m3resp-integration",
]
emg = [
  "resurfemg @ git+https://github.com/M3RESP/ReSurfEMG.git@m3resp-integration",
  "ipywidgets",
]
all = [
  "eitprocessing @ git+https://github.com/M3RESP/eitprocessing.git@m3resp-integration",
  "resurfemg @ git+https://github.com/M3RESP/ReSurfEMG.git@m3resp-integration",
  "ipywidgets",
]
dev = [
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "types-PyYAML",
]

[project.scripts]
m3resp = "m3resp.__main__:main"

[project.urls]
Homepage = "https://github.com/M3RESP/m3resp"
Repository = "https://github.com/M3RESP/m3resp"
Issues = "https://github.com/M3RESP/m3resp/issues"

[tool.hatch.version]
path = "src/m3resp/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/m3resp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.marimo.runtime]
# Raise the cell-output size cap (marimo default 8 MB) so the multimodal viewer
# can render lower-downsample / wider-window traces. A full-resolution 180 s
# Biopac window is ~18 MB of Plotly JSON; 50 MB leaves headroom while still
# guarding against runaway outputs. Note: Scattergl speeds up *rendering* but
# does not shrink this serialized payload, and the figure is re-sent over the
# WebSocket on every slider drag -- keep downsample moderate for smooth interaction.
output_max_bytes = 50_000_000

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.12"
packages = ["m3resp"]

[[tool.mypy.overrides]]
module = [
  "eitprocessing.*",
  "matplotlib.*",
  "resurfemg.*",
]
ignore_missing_imports = true
