[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m3resp"
description = "Multimodal respiratory processing for EIT, EMG, and ventilator signals"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "M3Resp contributors" },
]
keywords = ["respiration", "EIT", "EMG", "multimodal", "biomedical"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "loguru",
  "numpy",
  "pandas",
  "pydantic>=2",
  "PyYAML",
  "scipy",
]
dynamic = ["version"]

[project.optional-dependencies]
eit = [
  "eitprocessing @ git+https://github.com/M3RESP/eitprocessing.git@m3resp-integration",
]
emg = [
  "resurfemg @ git+https://github.com/M3RESP/ReSurfEMG.git@m3resp-integration",
  "ipywidgets",
]
all = [
  "eitprocessing @ git+https://github.com/M3RESP/eitprocessing.git@m3resp-integration",
  "resurfemg @ git+https://github.com/M3RESP/ReSurfEMG.git@m3resp-integration",
  "ipywidgets",
]
dev = [
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff>=0.16,<0.17",
  "mypy",
  "types-PyYAML",
  "pandas-stubs",
  "scipy-stubs",
]
docs = [
  "Sphinx>=8.2",
  "myst-parser>=4",
  "pydata-sphinx-theme>=0.16",
  "sphinx-design>=0.6",
  "sphinx-gallery>=0.19",
  "matplotlib>=3.9",
]

[project.scripts]
m3resp = "m3resp.__main__:main"

[project.urls]
Homepage = "https://github.com/M3RESP/m3resp"
Repository = "https://github.com/M3RESP/m3resp"
Issues = "https://github.com/M3RESP/m3resp/issues"

[tool.hatch.version]
path = "src/m3resp/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
sources = ["src"]

[tool.setuptools.packages.find]
include = ["resurfemg*"]

[tool.hatch.build.targets.wheel]
packages = ["src/m3resp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"] 

[tool.marimo.runtime]
# Raise the cell-output size cap (marimo default 8 MB) so the multimodal viewer
# can render lower-downsample / wider-window traces. A full-resolution 180 s
# Biopac window is ~18 MB of Plotly JSON; 50 MB leaves headroom while still
# guarding against runaway outputs. Note: Scattergl speeds up *rendering* but
# does not shrink this serialized payload, and the figure is re-sent over the
# WebSocket on every slider drag -- keep downsample moderate for smooth interaction.
output_max_bytes = 50_000_000

[tool.ruff]
line-length = 88
target-version = "py312"


[tool.ruff.lint]
select = ["ALL"]
pydocstyle.convention = "google" # docstring settings
ignore = [
    # Unwanted (potentially)
    "FBT",    # Using boolean arguments
    "ANN002", # Missing type annotation for `*args`
    "ANN003", # Missing type annotation for `**kwargs`
    "ANN204", # Missing return type annotation for special (dunder) method
    "S105",   # Possible hardcoded password
    "S311",   # insecure random generators
    "PT011",  # pytest-raises-too-broad
    "PD011",  # Use of .values. Assumes .values refers to pandas dataframes, not object attributes
    "TD",     # TODOs
    "FIX002", # Resolve TODOs
    "B028",   # No explicit `stacklevel` keyword argument found in warning
    # "SIM108", # Use ternary operator (not sure if we want to ignore this)
    # Unneeded docstrings
    "D100",   # Missing module docstring
    "D104",   # Missing public package docstring
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in `__init__`
    "COM812", # missing trailing comma
    "ISC001", # single line implicit string concatenation
    "PLR2004", # Comparison against unnamed value
    "TRY003", # Avoid specifying long messages outside the exception class

]

# Set autofixing.
fixable = ["ALL"]
unfixable = [
    "F401",   # unused imports (should not disappear while editing)
    "RUF100", # unused noqa (should not disappear while editing)
    "B905",   # autofill strictness of zip (think about preferred behavior)
]
extend-safe-fixes = [
    "D202",   # No blank lines allowed after function docstring
    "D205",   # 1 blank line required between summary line and description
    "D415",   # First line should end with a period, question mark, or exclamation point
    "D300",   # Use triple double quotes `"""`
    "D200",   # One-line docstring should fit on one line
    "TC",     # Format type checking only imports
    "ISC001", # Implicitly concatenated strings on a single line
    "EM",     # Exception message variables
    "RUF013", # Implicit Optional
    "B006",   # Mutable default argument
    "TID252", # Absolute imports over relative imports
]
pylint.max-args = 9

[tool.ruff.lint.per-file-ignores]
# marimo stores notebooks as plain Python: every cell is a function that ends in
# a bare expression (its output) and a `return` of the variables other cells
# consume. Both are load-bearing in that format, not dead code.
"notebooks/**/*.py" = ["B018", "PLR1711"]
"tools/visualization_tools/**/*.py" = ["B018", "PLR1711"]
'tests/**/*.py' = [
    'INP001', # Test directories are not namespace packages
    'S101',   # Pytest tests should use `assert`
    'RUF018', # Assignment expressions in assert are fine here
]

[tool.mypy]
python_version = "3.12"
packages = ["m3resp"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "eitprocessing.*",
  "matplotlib.*",
  "resurfemg.*",
]
ignore_missing_imports = true


