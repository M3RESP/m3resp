name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check documentation files
        run: |
          test -f README.md
          test -f docs/stage1.md
          python - <<'PY'
          from pathlib import Path

          for path in [Path("README.md"), Path("docs/stage1.md")]:
              text = path.read_text(encoding="utf-8")
              assert "M3Resp" in text, f"{path} should describe M3Resp"
          PY

      - name: Check package metadata
        run: python -m pip install build && python -m build --sdist --wheel
