name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time. A newer push waits for the running deployment to finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The tutorials read the recordings in tests/data, which Git LFS stores.
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,docs]"

      - name: Build documentation
        run: |
          python -m sphinx -W --keep-going -b html docs docs/_build/html
          test -f docs/_build/html/index.html
          test -f docs/_build/html/tutorials/index.html
          test -f docs/_build/html/tutorials/30_multimodal.html
          test -f docs/_build/html/how-to/index.html
          test -f docs/_build/html/api/index.html
          test -f docs/_build/html/searchindex.js

      - name: Check package metadata
        run: python -m pip install build && python -m build --sdist --wheel

      - name: Upload documentation for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Publishes the documentation built from main at https://m3resp.github.io/m3resp/
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
