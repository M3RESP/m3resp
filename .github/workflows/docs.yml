name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build documentation
        run: |
          python -m sphinx -W --keep-going -b html docs docs/_build/html
          test -f docs/_build/html/index.html
          test -f docs/_build/html/tutorials/index.html
          test -f docs/_build/html/api/index.html
          test -f docs/_build/html/searchindex.js

      - name: Check package metadata
        run: python -m pip install build && python -m build --sdist --wheel
